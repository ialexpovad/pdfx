<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 img-src 'self' data:;
                 style-src 'self' 'unsafe-inline';
                 script-src 'self' 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDFX</title>
  <style>
    /* ===== Theming ===== */
    :root {
      color-scheme: light dark;
      --bg: #0a0b0d;
      --surface: #0f1115;
      --surface-2: #0b0c10;
      --elev: #12141a;
      --text: #e7e9ef;
      --muted: #9aa0ad;
      --brand: #7c3aed;
      --brand-2: #a78bfa;
      --ok: #16a34a;
      --err: #ef4444;
      --border: #1e2230;
      --ring: 0 0 0 3px rgba(124,58,237,.3);
      --shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.02);
      --radius: 14px;
    }

    * { box-sizing: border-box }
    html, body { height:100% }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Layout ===== */
    .app { padding: 18px 18px 26px; max-width: 1280px; margin: 0 auto; }
    header.appbar {
      display:flex; align-items:center; justify-content:space-between;
      background: linear-gradient(180deg, #121429 0%, var(--surface) 100%);
      border:1px solid var(--border); border-radius: var(--radius);
      padding: 12px 14px; box-shadow: var(--shadow);
    }
    .brand { display:flex; align-items:center; gap:12px; }
    .logo {
      width:28px; height:28px; border-radius: 8px; display:grid; place-items:center;
      background: radial-gradient(120% 120% at 0% 0%, var(--brand) 0%, #5b21b6 40%, #1f1144 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1);
    }
    .logo svg { width:18px; height:18px; }
    .title { font-weight:800; letter-spacing:.2px; }
    .subtitle { color:var(--muted); font-size:12px; margin-top:2px }

    /* Actions */
    .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
    .btn {
      appearance:none; border:1px solid #0000; cursor:pointer; user-select:none;
      background:var(--brand); color:white; font-weight:700;
      padding:9px 14px; border-radius:10px; display:inline-flex; gap:8px; align-items:center;
      transition: transform .06s ease, opacity .2s ease, box-shadow .2s ease, background .2s ease;
      box-shadow: 0 6px 16px rgba(124,58,237,.25);
    }
    .btn:hover { transform: translateY(-1px) }
    .btn:active { transform: translateY(0) scale(.98) }
    .btn.secondary {
      background: #1a1d25; color:var(--text); border:1px solid var(--border);
      box-shadow: none;
    }
    .btn.ghost { background:transparent; color:var(--text); border:1px solid var(--border) }

    .btn:disabled { opacity:.6; cursor:not-allowed; transform:none; box-shadow:none }

    .btn svg { width:16px; height:16px }

    /* ===== Grid ===== */
    .grid {
      display:grid; gap:12px; margin-top:14px;
      grid-template-columns: 360px 1fr;
    }
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr } }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .panel { padding:14px }
    .panel + .panel { margin-top:10px }

    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap }
    .stack { display:flex; flex-direction:column; gap:8px }

    .field { display:flex; flex-direction:column; gap:6px; flex:1 }
    label { font-size:12px; color:var(--muted) }

    .input, .select {
      background: var(--surface-2); color: var(--text);
      padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); outline:none;
      transition: box-shadow .15s ease, border-color .15s ease;
    }
    .input:focus { box-shadow: var(--ring); border-color: var(--brand) }

    .hint { color:var(--muted); font-size:12px }

    /* ===== Dropzone ===== */
    .drop {
      border: 2px dashed rgba(124,58,237,.55);
      border-radius: var(--radius);
      background: linear-gradient(180deg, #0d0a12, #0a0b0e);
      text-align:center; color: var(--brand-2);
      padding: 26px; transition: border-color .15s ease, transform .08s ease;
    }
    .drop.active { border-color: var(--brand); transform: translateY(-1px) }

    /* ===== Results ===== */
    .toolbar {
      display:flex; align-items:center; justify-content:space-between;
      gap:10px; padding:10px 14px; border-bottom:1px solid var(--border);
      background: linear-gradient(180deg, #0f1119, #0b0d13);
      border-top-left-radius: var(--radius); border-top-right-radius: var(--radius);
    }
    .statusline { display:flex; gap:10px; align-items:center; flex-wrap:wrap }
    .badge {
      font-size:12px; padding:4px 8px; border-radius:999px;
      background:#10121a; border:1px solid var(--border); color:var(--muted)
    }
    .badge.ok { color:#c7f9d4; background:#0c1a12; border-color:rgba(22,163,74,.35) }
    .badge.err { color:#ffd4d4; background:#1a0e10; border-color:rgba(239,68,68,.35) }

    .pages {
      max-height: 60vh; overflow:auto; padding: 12px;
      background: #0a0b0f; border-bottom-left-radius: var(--radius); border-bottom-right-radius: var(--radius);
      border-left:1px solid var(--border); border-right:1px solid var(--border); border-bottom:1px solid var(--border);
    }
    .page { margin: 0 0 14px 0; border:1px solid var(--border); border-radius: 12px; overflow:hidden; background:#0b0d12 }
    .pagehead {
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:8px 10px; background:#101321; border-bottom:1px solid var(--border)
    }
    .pagehead h4 { margin:0; font-size:13px; color:var(--brand-2) }

    pre {
      margin:0; padding:12px; white-space: pre-wrap; word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      line-height:1.4; font-size:13px;
    }
    mark { background: rgba(124,58,237,.28); padding:0 .5px; border-radius:2px }

    /* ===== Busy overlay ===== */
    .busy {
      position: fixed; inset: 0; display:none; place-items:center;
      background: rgba(3,5,10,.4); backdrop-filter: blur(2px); z-index: 50;
    }
    .busy.show { display:grid }
    .spinner {
      width: 44px; height: 44px; border-radius: 999px; border: 3px solid rgba(255,255,255,.15);
      border-top-color: var(--brand); animation: spin .8s linear infinite;
      box-shadow: 0 0 0 3px rgba(124,58,237,.15);
    }
    @keyframes spin { to { transform: rotate(360deg) } }

    /* ===== Focus & a11y ===== */
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0 }
    .kbd { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color:var(--muted); background:#0f1320; border:1px solid var(--border); padding:3px 6px; border-radius:6px }

    /* Scrollbars (webkit) */
    .pages::-webkit-scrollbar { height: 12px; width: 12px }
    .pages::-webkit-scrollbar-thumb { background:#1d2233; border-radius:8px; border:3px solid #0a0b0f }
  </style>
</head>
<body>
  <div class="app">
    <!-- App bar -->
    <header class="appbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 12h14" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <path d="M7 6h10M7 18h10" stroke="white" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="title">PDFX — PoDoFo 1.x Text Extractor</div>
          <div class="subtitle">Drop a PDF or press <span class="kbd">Ctrl/⌘ O</span>. Extract <span class="kbd">Ctrl/⌘ E</span>. Export <span class="kbd">Ctrl/⌘ S</span>.</div>
        </div>
      </div>
      <div class="actions">
        <button id="open" class="btn" title="Open PDF (Ctrl/⌘ O)">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-3-3m3 3l3-3M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Open PDF…
        </button>
        <button id="extract" class="btn" title="Extract (Ctrl/⌘ E)" disabled>
          <svg viewBox="0 0 24 24" fill="none"><path d="M8 6h8M6 10h12M8 14h8M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Extract
        </button>
        <button id="export" class="btn secondary" title="Export .txt (Ctrl/⌘ S)" disabled>
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 16v-8m0 8l-3-3m3 3l3-3M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Export .txt
        </button>
      </div>
    </header>

    <!-- Main grid -->
    <section class="grid">
      <!-- Left: Controls -->
      <aside class="card">
        <div class="panel">
          <div class="stack">
            <div class="field">
              <label for="pages">Pages to extract</label>
              <input id="pages" class="input" placeholder="e.g. 1-3, 6" inputmode="numeric" autocomplete="off">
              <div class="hint">Leave empty for all pages. Ranges and lists are supported.</div>
            </div>

            <div class="drop" id="drop" role="button" aria-label="Drop a PDF here">
              <div style="font-weight:700; margin-bottom:4px">Drop a PDF here</div>
              <div class="hint">Or use the Open button above</div>
            </div>

            <div class="stack" style="margin-top:6px">
              <div id="file" class="hint"></div>
              <div id="info" class="hint"></div>
              <div id="error" class="hint" style="color: var(--err)"></div>
            </div>

            <div class="row" style="margin-top:4px">
              <button id="copyAll" class="btn ghost" disabled title="Copy extracted text to clipboard">
                <svg viewBox="0 0 24 24" fill="none"><path d="M9 9h9v12H9zM6 3h9v3H6z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                Copy All
              </button>
              <button id="clear" class="btn ghost" disabled title="Clear output">
                <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7l1 12m4-12-1 12M6 7l1 12m10-12-1 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                Clear
              </button>
            </div>
          </div>
        </div>
      </aside>

      <!-- Right: Results -->
      <section class="card">
        <div class="toolbar">
          <div class="statusline">
            <div id="badgeFile" class="badge">No file</div>
            <div id="badgePages" class="badge">0 page(s)</div>
            <div id="badgeStatus" class="badge ok" style="display:none">Ready</div>
            <div id="badgeError" class="badge err" style="display:none">Error</div>
          </div>
          <div class="row" style="gap:8px">
            <input id="filter" class="input" placeholder="Search in results… (regex OK)">
            <span class="hint" id="filterCount" aria-live="polite"></span>
          </div>
        </div>
        <div id="out" class="pages" aria-live="polite" aria-busy="false"></div>
      </section>
    </section>
  </div>

  <!-- Busy overlay -->
  <div id="busy" class="busy" aria-hidden="true">
    <div class="spinner" aria-label="Working…"></div>
  </div>

  <script type="module">
    // ===== Elements =====
    const els = {
      drop:     document.getElementById('drop'),
      open:     document.getElementById('open'),
      extract:  document.getElementById('extract'),
      export:   document.getElementById('export'),
      pages:    document.getElementById('pages'),
      file:     document.getElementById('file'),
      info:     document.getElementById('info'),
      error:    document.getElementById('error'),
      out:      document.getElementById('out'),
      copyAll:  document.getElementById('copyAll'),
      clear:    document.getElementById('clear'),
      busy:     document.getElementById('busy'),
      badgeFile:  document.getElementById('badgeFile'),
      badgePages: document.getElementById('badgePages'),
      badgeStatus:document.getElementById('badgeStatus'),
      badgeError: document.getElementById('badgeError'),
      filter:     document.getElementById('filter'),
      filterCount:document.getElementById('filterCount'),
    }

    // ===== State =====
    let currentPath = null
    let currentName = null
    let lastResult = []   // array of page texts
    let busy = false
    let dragDepth = 0

    function ensureBridge() {
      if (!window.pdfx) {
        setError('Preload failed (window.pdfx missing). Restart app or rebuild addon.')
        throw new Error('preload bridge missing')
      }
    }
    ensureBridge()
    window.pdfx.onError?.((msg) => setError(msg))

    // ===== UI helpers =====
    function setBusy(v) {
      busy = v
      els.open.disabled = v
      els.extract.disabled = v || !currentPath
      els.export.disabled = v || lastResult.length === 0
      els.copyAll.disabled = v || lastResult.length === 0
      els.clear.disabled = v || lastResult.length === 0
      els.busy.classList.toggle('show', v)
      els.out.setAttribute('aria-busy', String(v))
    }
    function setError(msg) {
      els.error.textContent = msg || ''
      els.badgeError.style.display = msg ? '' : 'none'
      els.badgeStatus.style.display = msg ? 'none' : ''
    }
    function setInfo(msg) { els.info.textContent = msg || '' }
    function updateBadges() {
      els.badgeFile.textContent = currentPath ? (currentName || 'Selected file') : 'No file'
      els.badgePages.textContent = `${lastResult.length} page(s)`
    }

    function sanitizeFilename(p) {
      if (!p) return null
      const parts = p.replace(/\\+/g,'/').split('/')
      return parts[parts.length - 1] || p
    }

    // Parse "1-3,6" -> array of unique sorted zero-based indices
    function parsePages(spec) {
      if (!spec) return null
      const out = new Set()
      for (const group of spec.split(',')) {
        const s = group.trim()
        if (!s) continue
        const m = s.match(/^(\d+)(?:-(\d+))?$/)
        if (!m) continue
        const a = Math.max(0, parseInt(m[1], 10) - 1)
        const b = Math.max(0, m[2] ? parseInt(m[2], 10) - 1 : a)
        const from = Math.min(a,b), to = Math.max(a,b)
        for (let i = from; i <= to; i++) out.add(i)
      }
      return Array.from(out).sort((x,y)=>x-y)
    }

    // Render pages into cards; supports optional highlighting via 'filter'
    function renderPages(pages, filterRe=null) {
      els.out.innerHTML = ''
      pages.forEach((text, i) => {
        const wrap = document.createElement('div')
        wrap.className = 'page'

        const head = document.createElement('div')
        head.className = 'pagehead'

        const h = document.createElement('h4')
        h.textContent = `Page ${i+1}`
        head.appendChild(h)

        const btn = document.createElement('button')
        btn.className = 'btn ghost'
        btn.style.padding = '6px 10px'
        btn.title = 'Copy this page'
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M9 9h9v12H9zM6 3h9v3H6z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>'
        btn.addEventListener('click', () => copyToClipboard(text))
        head.appendChild(btn)

        const pre = document.createElement('pre')
        if (!filterRe) {
          pre.textContent = text
        } else {
          // Highlight safely without innerHTML injection
          const frag = document.createDocumentFragment()
          let lastIndex = 0
          const str = text
          str.replace(filterRe, (match, offset) => {
            frag.appendChild(document.createTextNode(str.slice(lastIndex, offset)))
            const mark = document.createElement('mark')
            mark.textContent = match
            frag.appendChild(mark)
            lastIndex = offset + match.length
            return match
          })
          frag.appendChild(document.createTextNode(str.slice(lastIndex)))
          pre.appendChild(frag)
        }

        wrap.appendChild(head)
        wrap.appendChild(pre)
        els.out.appendChild(wrap)
      })
      els.export.disabled = pages.length === 0
      els.copyAll.disabled = pages.length === 0
      els.clear.disabled = pages.length === 0
      setInfo(pages.length ? `Extracted ${pages.length} page(s)` : '')
      updateBadges()
    }

    async function doExtract() {
      if (!currentPath) return
      setError('')
      setBusy(true)
      try {
        const spec = els.pages.value.trim()
        const indices = parsePages(spec)
        lastResult = indices && indices.length
          ? await window.pdfx.extractPages(currentPath, indices)
          : await window.pdfx.extractAll(currentPath)
        renderPages(lastResult, currentFilterRe())
      } catch (err) {
        setError(err?.message || String(err))
        lastResult = []
        els.out.innerHTML = ''
      } finally {
        setBusy(false)
      }
    }

    function currentFilterRe() {
      const q = els.filter.value.trim()
      if (!q) { els.filterCount.textContent=''; return null }
      try {
        const re = new RegExp(q, 'gi')
        let total = 0
        for (const page of lastResult) {
          const m = page.match(re)
          total += m ? m.length : 0
        }
        els.filterCount.textContent = total ? `${total} match(es)` : 'No matches'
        return re
      } catch {
        els.filterCount.textContent = 'Invalid regex'
        return null
      }
    }

    function applyFilter() {
      const re = currentFilterRe()
      renderPages(lastResult, re)
    }

    // Clipboard
    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text)
        setInfo('Copied to clipboard.')
      } catch (e) {
        setError('Clipboard copy failed.')
      }
    }

    // ===== Events: Drag & Drop =====
    ['dragenter','dragover'].forEach(ev =>
      window.addEventListener(ev, e => {
        e.preventDefault(); e.stopPropagation()
        dragDepth++
        els.drop.classList.add('active')
      })
    )
    ;['dragleave','drop'].forEach(ev =>
      window.addEventListener(ev, e => {
        e.preventDefault(); e.stopPropagation()
        dragDepth = Math.max(0, dragDepth - 1)
        if (dragDepth === 0) els.drop.classList.remove('active')
      })
    )
    window.addEventListener('drop', async e => {
      const f = e.dataTransfer?.files?.[0]
      if (!f) return
      setError('')
      currentPath = f.path
      currentName = f.name || sanitizeFilename(currentPath)
      els.file.textContent = `File: ${currentPath}`
      els.extract.disabled = false
      updateBadges()
      setBusy(true)
      try {
        lastResult = await window.pdfx.extractAll(currentPath)
        renderPages(lastResult, currentFilterRe())
      } catch (err) {
        setError(err?.message || String(err))
        lastResult = []
        els.out.innerHTML = ''
      } finally { setBusy(false) }
    })

    // ===== Buttons & Inputs =====
    els.open.addEventListener('click', async () => {
      try {
        const p = await window.pdfx.selectPdf()
        if (!p) return
        setError('')
        currentPath = p
        currentName = sanitizeFilename(p)
        els.file.textContent = `File: ${currentPath}`
        els.extract.disabled = false
        updateBadges()
      } catch (err) {
        setError(err?.message || String(err))
      }
    })

    els.extract.addEventListener('click', doExtract)

    els.export.addEventListener('click', async () => {
      if (!lastResult.length) return
      const text = lastResult.join('\n')
      try {
        const base = (currentPath ? `${sanitizeFilename(currentPath)?.replace(/\.pdf$/i,'')}` : 'extracted') || 'extracted'
        const saved = await window.pdfx.saveText(`${base}.txt`, text)
        if (saved) { setInfo(`Saved to ${saved}`); setError('') }
      } catch (err) { setError(err?.message || String(err)) }
    })

    els.copyAll.addEventListener('click', () => copyToClipboard(lastResult.join('\n')))
    els.clear.addEventListener('click', () => {
      lastResult = []; renderPages(lastResult); setInfo('Cleared.'); setError('')
    })

    // Live search/filter
    els.filter.addEventListener('input', applyFilter)

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      const mod = e.metaKey || e.ctrlKey
      if (!mod) return
      if (e.key.toLowerCase() === 'o') { e.preventDefault(); els.open.click() }
      if (e.key.toLowerCase() === 'e') { e.preventDefault(); els.extract.click() }
      if (e.key.toLowerCase() === 's') { e.preventDefault(); els.export.click() }
    })

    // Init
    function init() {
      setBusy(false)
      updateBadges()
      setInfo('Ready.')
    }
    init()
  </script>
</body>
</html>
