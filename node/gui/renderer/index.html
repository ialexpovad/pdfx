<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 img-src 'self' data:;
                 style-src 'self' 'unsafe-inline';
                 script-src 'self' 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDFX</title>
  <style>
    /* ===== Theme ===== */
    :root{
      color-scheme: light dark;
      --bg:#0a0b0d; --surface:#0f1115; --surface-2:#0b0c10;
      --text:#e7e9ef; --muted:#9aa0ad;
      --brand:#7c3aed; --brand-2:#a78bfa;
      --ok:#16a34a; --err:#ef4444;
      --border:#1e2230; --ring:0 0 0 3px rgba(124,58,237,.32);
      --shadow:0 12px 34px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.02);
      --radius:14px; --blur:10px;

      --bg-gradient: radial-gradient(120% 120% at 0% 0%, #16182b 0%, var(--bg) 35%);
      --appbar-bg: linear-gradient(180deg, rgba(18,20,41,.75) 0%, rgba(15,17,26,.7) 100%);
      --page-bg: #0a0b0f;

      --badge-bg:#10121a; --badge-color:var(--muted); --badge-border:var(--border);
    }
    :root[data-theme="light"]{
      --bg:#f7f7fb; --surface:#ffffff; --surface-2:#f3f4f8; --text:#0c0e12; --muted:#606776;
      --brand:#6d28d9; --brand-2:#7c3aed; --ok:#16a34a; --err:#dc2626; --border:#e7e7ef;
      --ring:0 0 0 4px rgba(109,40,217,.18); --shadow:0 10px 28px rgba(17,24,39,.08); --blur:8px;

      --bg-gradient: radial-gradient(120% 120% at 0% 0%, #ffffff 0%, var(--bg) 40%);
      --appbar-bg: linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,.92) 100%);
      --page-bg:#ffffff;

      --badge-bg:#f6f7fb; --badge-color:#5b6474; --badge-border:#e7e7ef;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--bg-gradient); color:var(--text);
      font:14px/1.55 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    .app{padding:18px 18px 28px; max-width:1280px; margin:0 auto;}
    header.appbar{
      position:sticky; top:0; z-index:30;
      display:flex; align-items:center; justify-content:space-between;
      background:var(--appbar-bg);
      border:1px solid var(--border); border-radius:var(--radius);
      padding:12px 14px; box-shadow:var(--shadow); backdrop-filter:blur(var(--blur));
      -webkit-app-region:drag;
    }
    /* extra room for macOS traffic lights (titleBarStyle: hiddenInset) */
    body.darwin header.appbar { padding-left: 80px; margin-top: 6px; }
    body.darwin .app { padding-top: 6px; }

    .brand{display:flex; align-items:center; gap:12px}
    .logo{
      width:28px; height:28px; border-radius:8px; display:grid; place-items:center;
      background:
        radial-gradient(150% 150% at -10% -10%, rgba(0,0,0,.06) 0%, transparent 40%),
        radial-gradient(120% 120% at 0% 0%, var(--brand) 0%, #4c1d95 45%, #1c143d 100%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
    }
    .logo svg{width:18px; height:18px; color:white}
    .title{font-weight:800; letter-spacing:.2px}
    .subtitle{color:var(--muted); font-size:12px; margin-top:2px}

    .actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap; -webkit-app-region:no-drag}
    .btn{
      appearance:none; border:1px solid #0000; cursor:pointer; user-select:none;
      background:var(--brand); color:white; font-weight:700;
      padding:9px 14px; border-radius:10px; display:inline-flex; gap:8px; align-items:center;
      transition:transform .06s ease, opacity .2s ease, box-shadow .2s ease, background .2s ease;
      box-shadow:0 8px 22px rgba(124,58,237,.28);
    }
    .btn:hover{transform:translateY(-1px)}
    .btn:active{transform:translateY(0) scale(.98)}
    .btn.secondary{background:#1a1d25; color:var(--text); border:1px solid var(--border); box-shadow:none}
    :root[data-theme="light"] .btn.secondary{ background:#eef0f6; color:#111; }
    .btn.ghost{background:transparent; color:var(--text); border:1px solid var(--border)}
    .btn.tiny{padding:6px 9px; font-weight:700}
    .btn:disabled{opacity:.55; cursor:not-allowed; transform:none; box-shadow:none; filter:saturate(.8)}
    .btn svg{width:16px; height:16px}

    .seg{display:inline-flex; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden}
    .seg button{border:0; padding:8px 10px; background:transparent; color:var(--muted)}
    .seg button.active{color:var(--text); background:var(--surface-2)}

    .grid{display:grid; gap:12px; margin-top:14px; grid-template-columns:360px 1fr}
    @media (max-width:980px){.grid{grid-template-columns:1fr}}

    .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:clip}
    .panel{padding:14px}
    .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
    .stack{display:flex; flex-direction:column; gap:8px}
    .field{display:flex; flex-direction:column; gap:6px; flex:1}
    label{font-size:12px; color:var(--muted)}

    .input{
      background:var(--surface-2); color:var(--text);
      padding:10px 12px; border-radius:10px; border:1px solid var(--border); outline:none;
      transition:box-shadow .15s ease, border-color .15s ease;
      -webkit-app-region:no-drag;
    }
    .input:focus{box-shadow:var(--ring); border-color:var(--brand)}
    .hint{color:var(--muted); font-size:12px}

    .drop{
      border:2px dashed rgba(124,58,237,.55); border-radius:var(--radius);
      background:linear-gradient(180deg, #0d0a12, #0a0b0e);
      text-align:center; color:var(--brand-2);
      padding:26px; transition:border-color .15s ease, transform .08s ease; cursor:pointer;
      -webkit-app-region:no-drag;
    }
    :root[data-theme="light"] .drop{
      background:linear-gradient(180deg, #fafbff, #f6f7fb);
      color:#6f51e9; border-color:rgba(124,58,237,.35);
    }
    .drop.active{border-color:var(--brand); transform:translateY(-1px)}

    .toolbar{
      display:flex; align-items:center; justify-content:space-between;
      gap:10px; padding:10px 14px; border-bottom:1px solid var(--border);
      background:linear-gradient(180deg, rgba(15,17,25,.9), rgba(11,13,19,.9));
    }
    :root[data-theme="light"] .toolbar{ background:linear-gradient(180deg, #ffffff, #fafbff); }

    .statusline{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
    .badge{
      font-size:12px; padding:4px 8px; border-radius:999px;
      background:var(--badge-bg); border:1px solid var(--badge-border); color:var(--badge-color)
    }
    .badge.ok{color:#166534; background:#ecfdf5; border-color:rgba(22,163,74,.35)}
    .badge.err{color:#991b1b; background:#fef2f2; border-color:rgba(239,68,68,.35)}

    .progress{height:3px; background:linear-gradient(90deg, transparent, var(--brand), transparent);
      background-size:200% 100%; animation:slide 1s linear infinite; display:none}
    .progress.show{display:block}
    @keyframes slide{to{background-position:-200% 0}}

    .pages{max-height:60vh; overflow:auto; padding:12px; background:var(--page-bg);
      border-left:1px solid var(--border); border-right:1px solid var(--border); border-bottom:1px solid var(--border)}
    :root[data-theme="light"] .pages{ background:#ffffff; }
    .page{margin:0 0 14px 0; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:#0b0d12}
    :root[data-theme="light"] .page{ background:#ffffff; }
    .pagehead{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 10px; background:#101321; border-bottom:1px solid var(--border)}
    :root[data-theme="light"] .pagehead{ background:#f7f7fb; }
    .pagehead h4{margin:0; font-size:13px; color:var(--brand-2)}
    pre{margin:0; padding:12px; white-space:pre-wrap; word-break:break-word;
      font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; line-height:1.45; font-size:13px}
    mark{background:rgba(124,58,237,.28); padding:0 .5px; border-radius:2px}

    .empty{display:grid; place-items:center; text-align:center; color:var(--muted); padding:32px 14px}
    .empty svg{width:64px; height:64px; opacity:.85; margin-bottom:10px; color:var(--brand-2)}

    .busy{position:fixed; inset:0; display:none; place-items:center; background:rgba(3,5,10,.4); backdrop-filter:blur(2px); z-index:50}
    .busy.show{display:grid}
    .spinner{width:44px; height:44px; border-radius:999px; border:3px solid rgba(0,0,0,.15); border-top-color:var(--brand); animation:spin .8s linear infinite; box-shadow:0 0 0 3px rgba(124,58,237,.15)}
    @keyframes spin{to{transform:rotate(360deg)}}

    .toast{position:fixed; bottom:16px; right:16px; z-index:60; padding:10px 12px; border-radius:10px; background:var(--surface);
      border:1px solid var(--border); min-width:220px; box-shadow:var(--shadow); display:none; gap:10px; align-items:center}
    .toast.show{display:flex} .toast.ok{border-color:rgba(22,163,74,.35)} .toast.err{border-color:rgba(239,68,68,.35)}

    .kbd{font:600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color:var(--muted); background:#0f1320; border:1px solid var(--border); padding:3px 6px; border-radius:6px}
    :root[data-theme="light"] .kbd{ background:#eef0f6; color:#334155; border-color:#e7e7ef; }
    .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0}

    .pages::-webkit-scrollbar{height:12px; width:12px}
    .pages::-webkit-scrollbar-thumb{background:#1d2233; border-radius:8px; border:3px solid #0a0b0f}
    :root[data-theme="light"] .pages::-webkit-scrollbar-thumb{background:#cfd5e3; border-color:#fff}
  </style>
</head>
<body>
  <div class="app">
    <header class="appbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M7 6h10M7 18h10" stroke="currentColor" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="title">PDFX — PoDoFo 1.x Text Extractor</div>
          <div class="subtitle">Drop a PDF or press <span class="kbd">Ctrl/⌘ O</span>. Extract <span class="kbd">Ctrl/⌘ E</span>. Export <span class="kbd">Ctrl/⌘ S</span>.</div>
        </div>
      </div>
      <div class="actions">
        <div class="seg" aria-label="Theme">
          <button id="themeDark" class="tiny" title="Dark theme">🌙</button>
          <button id="themeLight" class="tiny active" title="Light theme">🌤️</button>
        </div>
        <button id="open" class="btn" title="Open PDF (Ctrl/⌘ O)">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-3-3m3 3l3-3M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Open PDF…
        </button>
        <button id="extract" class="btn" title="Extract (Ctrl/⌘ E)" disabled>
          <svg viewBox="0 0 24 24" fill="none"><path d="M8 6h8M6 10h12M8 14h8M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Extract
        </button>
        <button id="export" class="btn secondary" title="Export .txt (Ctrl/⌘ S)" disabled>
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 16v-8m0 8l-3-3m3 3l3-3M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Export .txt
        </button>
      </div>
    </header>

    <div id="progress" class="progress"></div>

    <section class="grid">
      <aside class="card">
        <div class="panel">
          <div class="stack">
            <div class="field">
              <label for="pages">Pages to extract</label>
              <input id="pages" class="input" placeholder="e.g. 1-3, 6" inputmode="numeric" autocomplete="off">
              <div class="hint">Leave empty for all pages. Ranges and lists are supported.</div>
            </div>

            <div class="drop" id="drop" role="button" aria-label="Drop a PDF here">
              <div style="font-weight:700; margin-bottom:4px">Drop a PDF here</div>
              <div class="hint">Or click to choose a file</div>
            </div>

            <div class="stack" style="margin-top:6px">
              <div id="file" class="hint"></div>
              <div id="info" class="hint"></div>
              <div id="error" class="hint" style="color: var(--err)"></div>
            </div>

            <div class="row" style="margin-top:4px">
              <button id="copyAll" class="btn ghost" disabled title="Copy extracted text to clipboard">
                
                                
                <svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" viewBox="0 0 111.07 122.88" style="enable-background:new 0 0 111.07 122.88" xml:space="preserve">
                <g>
                <path class="st0" d="M97.67,20.81L97.67,20.81l0.01,0.02c3.7,0.01,7.04,1.51,9.46,3.93c2.4,2.41,3.9,5.74,3.9,9.42h0.02v0.02v75.28 v0.01h-0.02c-0.01,3.68-1.51,7.03-3.93,9.46c-2.41,2.4-5.74,3.9-9.42,3.9v0.02h-0.02H38.48h-0.01v-0.02 c-3.69-0.01-7.04-1.5-9.46-3.93c-2.4-2.41-3.9-5.74-3.91-9.42H25.1c0-25.96,0-49.34,0-75.3v-0.01h0.02 c0.01-3.69,1.52-7.04,3.94-9.46c2.41-2.4,5.73-3.9,9.42-3.91v-0.02h0.02C58.22,20.81,77.95,20.81,97.67,20.81L97.67,20.81z M0.02,75.38L0,13.39v-0.01h0.02c0.01-3.69,1.52-7.04,3.93-9.46c2.41-2.4,5.74-3.9,9.42-3.91V0h0.02h59.19 c7.69,0,8.9,9.96,0.01,10.16H13.4h-0.02v-0.02c-0.88,0-1.68,0.37-2.27,0.97c-0.59,0.58-0.96,1.4-0.96,2.27h0.02v0.01v3.17 c0,19.61,0,39.21,0,58.81C10.17,83.63,0.02,84.09,0.02,75.38L0.02,75.38z M100.91,109.49V34.2v-0.02h0.02 c0-0.87-0.37-1.68-0.97-2.27c-0.59-0.58-1.4-0.96-2.28-0.96v0.02h-0.01H38.48h-0.02v-0.02c-0.88,0-1.68,0.38-2.27,0.97 c-0.59,0.58-0.96,1.4-0.96,2.27h0.02v0.01v75.28v0.02h-0.02c0,0.88,0.38,1.68,0.97,2.27c0.59,0.59,1.4,0.96,2.27,0.96v-0.02h0.01 h59.19h0.02v0.02c0.87,0,1.68-0.38,2.27-0.97c0.59-0.58,0.96-1.4,0.96-2.27L100.91,109.49L100.91,109.49L100.91,109.49 L100.91,109.49z"/></g></svg>

                Copy All
              </button>
              <button id="clear" class="btn ghost" disabled title="Clear output">
                <svg fill="#000000" width="800px" height="800px" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M7.004 23.087l7.08-7.081-7.07-7.071L8.929 7.02l7.067 7.069L23.084 7l1.912 1.913-7.089 7.093 7.075 7.077-1.912 1.913-7.074-7.073L8.917 25z"/></svg>             
                  Clear
              </button>
            </div>
          </div>
        </div>
      </aside>

      <section class="card" aria-live="polite">
        <div class="toolbar">
          <div class="statusline">
            <div id="badgeFile" class="badge">No file</div>
            <div id="badgePages" class="badge">0 page(s)</div>
            <div id="badgeStatus" class="badge ok">Ready</div>
            <div id="badgeError" class="badge err" style="display:none">Error</div>
          </div>
          <div class="row" style="gap:8px">
            <input id="filter" class="input" placeholder="Search in results… (regex OK)">
            <button id="clearFilter" class="btn ghost tiny" title="Clear search" disabled>✕</button>
            <span class="hint" id="filterCount" aria-live="polite"></span>
          </div>
        </div>
        <div id="out" class="pages" aria-busy="false">
          <div id="empty" class="empty">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="3" y="4" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
              <path d="M7 8h10M7 12h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <div style="font-weight:700">No content yet</div>
            <div class="hint">Open or drop a PDF to extract text.</div>
          </div>
        </div>
      </section>
    </section>
  </div>

  <div id="busy" class="busy" aria-hidden="true"><div class="spinner" aria-label="Working…"></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module">
    // ===== Elements =====
    const els = {
      drop: document.getElementById('drop'),
      open: document.getElementById('open'),
      extract: document.getElementById('extract'),
      export: document.getElementById('export'),
      pages: document.getElementById('pages'),
      file: document.getElementById('file'),
      info: document.getElementById('info'),
      error: document.getElementById('error'),
      out: document.getElementById('out'),
      empty: document.getElementById('empty'),
      copyAll: document.getElementById('copyAll'),
      clear: document.getElementById('clear'),
      busy: document.getElementById('busy'),
      toast: document.getElementById('toast'),
      progress: document.getElementById('progress'),
      badgeFile: document.getElementById('badgeFile'),
      badgePages: document.getElementById('badgePages'),
      badgeStatus: document.getElementById('badgeStatus'),
      badgeError: document.getElementById('badgeError'),
      filter: document.getElementById('filter'),
      clearFilter: document.getElementById('clearFilter'),
      filterCount: document.getElementById('filterCount'),  // <- add this
      themeDark: document.getElementById('themeDark'),
      themeLight: document.getElementById('themeLight'),
    }

    // ===== State =====
    let currentPath = null
    let currentName = null
    let lastResult = []         // array of page texts
    let dragDepth = 0

    // Platform class for titlebar spacing
    try { if (window.pdfx?.platform === 'darwin') document.body.classList.add('darwin') } catch {}

    // ===== Bridge =====
    function ensureBridge(){
      if(!window.pdfx){
        setError('Preload failed (window.pdfx missing). Restart app or rebuild addon.')
        throw new Error('preload bridge missing')
      }
    }
    ensureBridge()
    window.pdfx.onError?.((msg)=>{ setError(msg); showToast(msg,'err') })
    window.pdfx.onAction?.((name)=>{
      if(name==='open') els.open.click()
      if(name==='extract') els.extract.click()
      if(name==='export') els.export.click()
    })

    // ===== Theme (default LIGHT) =====
    initTheme()
    function initTheme(){
      const t = 'light'                 // force light every launch
      applyTheme(t)
    }
    function applyTheme(t){
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark')
      els.themeDark.classList.toggle('active', t === 'dark')
      els.themeLight.classList.toggle('active', t !== 'dark')
      localStorage.setItem('pdfx.theme', t)
    }
    els.themeDark.onclick  = () => applyTheme('dark')
    els.themeLight.onclick = () => applyTheme('light')

    // ===== UI helpers =====
    function setBusy(v){
      els.open.disabled = v
      els.extract.disabled = v || !currentPath
      els.export.disabled = v || lastResult.length === 0
      els.copyAll.disabled = v || lastResult.length === 0
      els.clear.disabled = v || lastResult.length === 0
      els.busy.classList.toggle('show', v)
      els.out.setAttribute('aria-busy', String(v))
      els.progress.classList.toggle('show', v)
    }
    function setError(msg){
      if (!els.error) return
      els.error.textContent = msg || ''
      const hasErr = !!msg
      if (els.badgeError) els.badgeError.style.display = hasErr ? '' : 'none'
      if (els.badgeStatus) els.badgeStatus.style.display = hasErr ? 'none' : ''
    }
    function setInfo(msg){ if (els.info) els.info.textContent = msg || '' }
    function showToast(text, kind='ok'){
      els.toast.className = `toast show ${kind==='err'?'err':'ok'}`
      els.toast.textContent = text
      setTimeout(()=>els.toast.classList.remove('show'), 1800)
    }
    function updateBadges(){
      if (els.badgeFile) els.badgeFile.textContent = currentPath ? (currentName || 'Selected file') : 'No file'
      if (els.badgePages) els.badgePages.textContent = `${lastResult.length} page(s)`
    }
    function sanitizeFilename(p){
      if(!p) return null
      const parts = p.replace(/\\+/g,'/').split('/')
      return parts[parts.length-1] || p
    }

    // Parse "1-3,6" -> indices (0-based)
    function parsePages(spec){
      if(!spec) return null
      const out = new Set()
      for(const group of spec.split(',')){
        const s = group.trim(); if(!s) continue
        const m = s.match(/^(\d+)(?:-(\d+))?$/); if(!m) continue
        const a = Math.max(0, parseInt(m[1],10)-1)
        const b = Math.max(0, m[2]?parseInt(m[2],10)-1:a)
        for(let i=Math.min(a,b); i<=Math.max(a,b); i++) out.add(i)
      }
      return Array.from(out).sort((x,y)=>x-y)
    }

    // Render pages
    function renderPages(pages, filterRe=null){
      els.out.innerHTML = ''
      if(!pages.length){
        els.out.appendChild(els.empty); els.empty.style.display = ''
      }else{
        els.empty.style.display = 'none'
        pages.forEach((text,i)=>{
          const wrap = document.createElement('div'); wrap.className='page'
          const head = document.createElement('div'); head.className='pagehead'
          const h = document.createElement('h4'); h.textContent = `Page ${i+1}`; head.appendChild(h)
          const btn = document.createElement('button'); btn.className='btn ghost tiny'; btn.title='Copy this page'
          btn.innerHTML = '<svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" viewBox="0 0 111.07 122.88" style="enable-background:new 0 0 111.07 122.88" xml:space="preserve"><g><path class="st0" d="M97.67,20.81L97.67,20.81l0.01,0.02c3.7,0.01,7.04,1.51,9.46,3.93c2.4,2.41,3.9,5.74,3.9,9.42h0.02v0.02v75.28 v0.01h-0.02c-0.01,3.68-1.51,7.03-3.93,9.46c-2.41,2.4-5.74,3.9-9.42,3.9v0.02h-0.02H38.48h-0.01v-0.02 c-3.69-0.01-7.04-1.5-9.46-3.93c-2.4-2.41-3.9-5.74-3.91-9.42H25.1c0-25.96,0-49.34,0-75.3v-0.01h0.02 c0.01-3.69,1.52-7.04,3.94-9.46c2.41-2.4,5.73-3.9,9.42-3.91v-0.02h0.02C58.22,20.81,77.95,20.81,97.67,20.81L97.67,20.81z M0.02,75.38L0,13.39v-0.01h0.02c0.01-3.69,1.52-7.04,3.93-9.46c2.41-2.4,5.74-3.9,9.42-3.91V0h0.02h59.19 c7.69,0,8.9,9.96,0.01,10.16H13.4h-0.02v-0.02c-0.88,0-1.68,0.37-2.27,0.97c-0.59,0.58-0.96,1.4-0.96,2.27h0.02v0.01v3.17 c0,19.61,0,39.21,0,58.81C10.17,83.63,0.02,84.09,0.02,75.38L0.02,75.38z M100.91,109.49V34.2v-0.02h0.02 c0-0.87-0.37-1.68-0.97-2.27c-0.59-0.58-1.4-0.96-2.28-0.96v0.02h-0.01H38.48h-0.02v-0.02c-0.88,0-1.68,0.38-2.27,0.97 c-0.59,0.58-0.96,1.4-0.96,2.27h0.02v0.01v75.28v0.02h-0.02c0,0.88,0.38,1.68,0.97,2.27c0.59,0.59,1.4,0.96,2.27,0.96v-0.02h0.01 h59.19h0.02v0.02c0.87,0,1.68-0.38,2.27-0.97c0.59-0.58,0.96-1.4,0.96-2.27L100.91,109.49L100.91,109.49L100.91,109.49 L100.91,109.49z"/></g></svg>'
          btn.onclick = ()=>copyToClipboard(text); head.appendChild(btn)
          const pre = document.createElement('pre')
          if(!filterRe) pre.textContent = text
          else{
            const frag = document.createDocumentFragment(); let last = 0; const str = text
            str.replace(filterRe,(m,off)=>{
              frag.appendChild(document.createTextNode(str.slice(last,off)))
              const mark = document.createElement('mark'); mark.textContent = m; frag.appendChild(mark)
              last = off + m.length; return m
            })
            frag.appendChild(document.createTextNode(str.slice(last))); pre.appendChild(frag)
          }
          wrap.appendChild(head); wrap.appendChild(pre); els.out.appendChild(wrap)
        })
      }
      const has = pages.length>0
      els.export.disabled = !has; els.copyAll.disabled = !has; els.clear.disabled = !has
      setInfo(has?`Extracted ${pages.length} page(s)`:'')
      updateBadges()
    }

    async function doExtract(){
      if(!currentPath) return
      setError(''); setBusy(true)
      try{
        const indices = parsePages(els.pages.value.trim())
        lastResult = indices && indices.length
          ? await window.pdfx.extractPages(currentPath, indices)
          : await window.pdfx.extractAll(currentPath)
        renderPages(lastResult, currentFilterRe()); showToast(`Extracted ${lastResult.length} page(s)`)
      }catch(err){
        setError(err?.message || String(err)); lastResult=[]; els.out.innerHTML=''; showToast('Extraction failed','err')
      }finally{ setBusy(false) }
    }

    function currentFilterRe(){
      const q = els.filter.value.trim()
      els.clearFilter.disabled = !q
      if(!q){ els.filterCount.textContent=''; return null }
      try{
        const re = new RegExp(q,'gi')
        let total = 0; for(const page of lastResult) total += (page.match(re)||[]).length
        els.filterCount.textContent = total ? `${total} match(es)` : 'No matches'
        return re
      }catch{
        els.filterCount.textContent = 'Invalid regex'; return null
      }
    }
    function applyFilter(){ renderPages(lastResult, currentFilterRe()) }

    async function copyToClipboard(text){
      try{ await navigator.clipboard.writeText(text); showToast('Copied to clipboard.') }
      catch{ setError('Clipboard copy failed.'); showToast('Clipboard copy failed','err') }
    }

    // ===== Drag & Drop (explicit handlers to avoid addEventListener issues) =====
    const onDragEnterOver = (e) => {
      e.preventDefault(); e.stopPropagation(); dragDepth++; els.drop.classList.add('active')
    }
    const onDragLeave = (e) => {
      e.preventDefault(); e.stopPropagation(); dragDepth = Math.max(0, dragDepth - 1)
      if (dragDepth === 0) els.drop.classList.remove('active')
    }
    const onDrop = async (e) => {
      e.preventDefault(); e.stopPropagation()
      dragDepth = 0; els.drop.classList.remove('active')
      const f = e.dataTransfer?.files?.[0]; if (!f) return
      await openPath(f.path, f.name)
    }
    window.addEventListener('dragenter', onDragEnterOver, { passive:false })
    window.addEventListener('dragover',  onDragEnterOver, { passive:false })
    window.addEventListener('dragleave', onDragLeave,     false)
    window.addEventListener('drop',      onDrop,          false)

    els.drop.addEventListener('click', ()=>els.open.click())

    async function openPath(p, nameHint){
      setError(''); currentPath = p; currentName = nameHint || sanitizeFilename(p)
      els.file.textContent = `File: ${currentPath}`; els.extract.disabled = false; updateBadges(); setBusy(true)
      try{
        lastResult = await window.pdfx.extractAll(currentPath)
        renderPages(lastResult, currentFilterRe()); showToast(`Loaded ${currentName}`)
      }catch(err){
        setError(err?.message || String(err)); lastResult=[]; els.out.innerHTML=''; showToast('Open failed','err')
      }finally{ setBusy(false) }
    }

    // ===== Buttons & inputs =====
    els.open.addEventListener('click', async ()=>{
      try{
        const p = await window.pdfx.selectPdf(); if(!p) return
        await openPath(p, sanitizeFilename(p))
      }catch(err){ setError(err?.message || String(err)) }
    })
    els.extract.addEventListener('click', doExtract)
    els.export.addEventListener('click', async ()=>{
      if(!lastResult.length) return
      const text = lastResult.join('\n')
      try{
        const base = (currentPath ? `${sanitizeFilename(currentPath)?.replace(/\.pdf$/i,'')}` : 'extracted') || 'extracted'
        const saved = await window.pdfx.saveText(`${base}.txt`, text)
        if(saved){ setInfo(`Saved to ${saved}`); setError(''); showToast('Exported .txt') }
      }catch(err){ setError(err?.message || String(err)); showToast('Export failed','err') }
    })
    els.copyAll.addEventListener('click', ()=>copyToClipboard(lastResult.join('\n')))
    els.clear.addEventListener('click', ()=>{ lastResult=[]; renderPages(lastResult); setInfo('Cleared.'); setError('') })
    els.filter.addEventListener('input', applyFilter)
    els.clearFilter.addEventListener('click', ()=>{ els.filter.value=''; applyFilter() })

    // ===== Shortcuts =====
    window.addEventListener('keydown', (e)=>{
      const mod = e.metaKey || e.ctrlKey
      if(mod && e.key.toLowerCase()==='o'){ e.preventDefault(); els.open.click() }
      if(mod && e.key.toLowerCase()==='e'){ e.preventDefault(); els.extract.click() }
      if(mod && e.key.toLowerCase()==='s'){ e.preventDefault(); els.export.click() }
      if(mod && e.key.toLowerCase()==='f'){ e.preventDefault(); els.filter.focus() }
      if(mod && e.key.toLowerCase()==='k'){ e.preventDefault(); applyTheme( (localStorage.getItem('pdfx.theme')||'light')==='light'?'dark':'light' ) }
    })

    // Init
    (function init(){ setBusy(false); updateBadges(); setInfo('Ready.') })()
  </script>
</body>
